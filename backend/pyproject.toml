[project]
name = "fastapiproject"
version = "0.1.0"
description = ""
authors = [
    {name = "Jordy van Zanten",email = "info@tradual.com"}
]
requires-python = "^3.14"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "sqlalchemy[asyncio] (>=2.0.49,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "aiohttp (>=3.13.5,<4.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "lxml (>=6.0.3,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "greenlet (>=3.4.0,<4.0.0)",
    "dnspython (>=2.7.0,<3.0.0)",
    "anthropic (>=0.40.0,<1.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
# The async engine in conftest.py's `setup_database`/`db_session` fixtures is
# session-scoped and lazily opens its first asyncpg connection inside whichever
# event loop is active at that point. pytest-asyncio's default (a fresh loop per
# test function) would then reuse that pooled connection under a *different* loop
# on the next DB-touching test, which asyncpg rejects. Scoping both the fixture and
# test loop to the session keeps every DB-backed test on the same loop the engine
# was first used in.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
