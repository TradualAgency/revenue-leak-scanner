services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: revleak
      POSTGRES_PASSWORD: revleak
      POSTGRES_DB: revleak
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revleak -d revleak"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # These win over env_file so the container always talks to the compose
      # network's db host/APP_ENV regardless of what a developer's local .env says.
      DATABASE_URL: postgresql+asyncpg://revleak:revleak@db:5432/revleak
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
